# Settings at the top are defaults. Any scope can override any of them except
# `project_branches`.
base = "main"                       # branch work starts from and pull requests target
label = "warlock-test"              # tickets an agent may pull carry this label
start_state = "In Progress"         # ticket state while an agent works it
review_state = "In Review"          # ticket state once its pull request is open
project_start_state = "In Progress" # project or epic state once its tickets are drafted
project_review_state = "In Review"  # project or epic state once every ticket is in review or done
project_branches = false            # flag-off regression test

# One [[scope]] per team area. A path belongs to the scope with the nearest
# matching entry in `paths`. A path no scope covers is closed to AI work.
[[scope]]
name = "warlock-test"
paths = ["."]
tracker = "linear"
team = "GEN"

[[scope]]
name = "api"
paths = ["services/api"]
tracker = "linear"
team = "WAR"

[[scope]]
name = "billing"
paths = ["services/billing"]
tracker = "jira"
team = "KAN"
